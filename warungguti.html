<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Uti</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-orange: #FF8C00; /* Warna oranye terang */
            --glowing-shadow: 0 0 5px var(--primary-orange),
                              0 0 10px var(--primary-orange),
                              0 0 15px var(--primary-orange),
                              0 0 20px var(--primary-orange);
            --dark-background: rgba(0, 0, 0, 0.7); /* Latar belakang gelap */
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://files.catbox.moe/2etf20.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #E5E7EB; /* Warna teks abu-abu terang */
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-background);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 10;
        }

        .glowing-border {
            border: 2px solid var(--primary-orange);
            box-shadow: var(--glowing-shadow);
            transition: all 0.3s ease-in-out;
        }

        .glowing-button {
            background-color: var(--primary-orange);
            color: white;
            box-shadow: var(--glowing-shadow);
            transition: all 0.3s ease-in-out;
        }

        .glowing-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 8px var(--primary-orange),
                        0 0 16px var(--primary-orange),
                        0 0 24px var(--primary-orange),
                        0 0 32px var(--primary-orange);
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Animasi loading */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--primary-orange);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Konten Utama -->
    <div class="container mx-auto p-4 sm:p-8">

        <!-- Header dan Logo -->
        <header class="flex items-center justify-between py-6 px-4">
            <div class="flex items-center space-x-4">
                <img src="https://files.catbox.moe/2etf20.png" alt="Warung Uti Logo" class="w-12 h-12 rounded-full">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-white">Warung Uti</h1>
            </div>
            
            <!-- Tombol Keranjang dan Pencarian -->
            <div class="flex items-center space-x-4">
                <!-- Search Bar -->
                <div class="relative hidden sm:block">
                    <input type="text" id="searchInput" placeholder="Cari produk..." class="w-full sm:w-64 p-2 pl-10 rounded-full glowing-border bg-gray-900 text-gray-200 focus:outline-none">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                    </div>
                </div>

                <!-- Tombol Keranjang -->
                <button id="cartIcon" class="relative p-3 bg-gray-900 rounded-full glowing-button">
                    <i class="fa-solid fa-shopping-cart text-white text-xl"></i>
                    <span id="cartCount" class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2 bg-red-600 text-white text-xs font-bold rounded-full px-2 py-1">0</span>
                </button>
            </div>
        </header>

        <!-- Bagian Jumbotron/Informasi Utama -->
        <section class="text-center py-12 sm:py-24">
            <h2 class="text-4xl sm:text-6xl font-black text-white mb-4 tracking-wide">PRE-ORDER</h2>
            <p class="text-lg sm:text-xl text-gray-300">Silahkan pilih menu yang anda suka lalu pesan sekarang</p>
        </section>

        <!-- Daftar Produk -->
        <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mb-12">
            <!-- Produk akan diisi oleh JavaScript -->
        </main>
    </div>

    <!-- Modal Form Pemesanan -->
    <div id="orderModal" class="fixed inset-0 hidden flex items-center justify-center z-50 modal-overlay">
        <div class="bg-gray-900 p-8 rounded-lg glowing-border w-11/12 sm:w-1/2 lg:w-1/3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold text-white">Detail Pemesanan</h3>
                <button onclick="closeModal('orderModal')" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <form id="orderForm">
                <input type="hidden" id="productNameInput">
                <div class="mb-4">
                    <label for="orderDate" class="block text-gray-300 mb-2">Tanggal & Hari</label>
                    <input type="date" id="orderDate" name="orderDate" required class="w-full p-2 rounded-md bg-gray-800 text-gray-200 border border-gray-700 glowing-border focus:outline-none focus:border-orange-500">
                </div>
                <div class="mb-4">
                    <label for="orderQuantity" class="block text-gray-300 mb-2">Berapa Porsi</label>
                    <input type="number" id="orderQuantity" name="orderQuantity" min="1" value="1" required class="w-full p-2 rounded-md bg-gray-800 text-gray-200 border border-gray-700 glowing-border focus:outline-none focus:border-orange-500">
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="closeModal('orderModal')" class="px-4 py-2 text-gray-300 rounded-md hover:bg-gray-800">Batal</button>
                    <button type="submit" class="glowing-button px-6 py-2 rounded-md font-semibold">
                        <span id="buyNowText">Beli Sekarang</span>
                        <div id="buyNowLoader" class="loader hidden"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Keranjang Belanja -->
    <div id="cartModal" class="fixed inset-0 hidden flex items-center justify-center z-50 modal-overlay">
        <div class="bg-gray-900 p-8 rounded-lg glowing-border w-11/12 sm:w-3/4 lg:w-1/2 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold text-white">Keranjang Belanja Anda</h3>
                <button onclick="closeModal('cartModal')" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <div id="cartItemsContainer" class="space-y-4">
                <!-- Item Keranjang akan diisi oleh JavaScript -->
            </div>
            <div class="mt-8 flex justify-end">
                <button id="checkoutButton" class="glowing-button px-6 py-2 rounded-md font-semibold hidden">
                    <span id="checkoutText">Checkout ke WhatsApp</span>
                    <div id="checkoutLoader" class="loader hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productsContainer = document.querySelector('main');
            const searchInput = document.getElementById('searchInput');
            const cartIcon = document.getElementById('cartIcon');
            const cartCount = document.getElementById('cartCount');
            const orderModal = document.getElementById('orderModal');
            const orderForm = document.getElementById('orderForm');
            const productNameInput = document.getElementById('productNameInput');
            const cartModal = document.getElementById('cartModal');
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            const checkoutButton = document.getElementById('checkoutButton');
            const buyNowText = document.getElementById('buyNowText');
            const buyNowLoader = document.getElementById('buyNowLoader');
            const checkoutText = document.getElementById('checkoutText');
            const checkoutLoader = document.getElementById('checkoutLoader');
            
            let cart = [];

            // Data produk dalam bentuk array
            const products = [
                { name: 'Ayam Bakar', image: 'https://files.catbox.moe/1d88a8.jpg' },
                { name: 'Ayam Geprek', image: 'https://files.catbox.moe/pkzirh.jpg' },
                { name: 'Ayam Suwir', image: 'https://files.catbox.moe/ank2ia.jpg' },
                { name: 'Nasi Goreng', image: 'https://files.catbox.moe/jkleph.jpg' },
                { name: 'Ayam Goreng', image: 'https://files.catbox.moe/wl2upu.jpg' },
                { name: 'Sate Totok', image: 'https://files.catbox.moe/6xpabt.jpg' }
            ];

            // Fungsi untuk membuat kartu produk
            const createProductCard = (product) => {
                const card = document.createElement('div');
                card.className = 'product-card bg-gray-900 p-6 rounded-xl glowing-border flex flex-col items-center text-center transition-transform hover:scale-105 duration-300 cursor-pointer';
                
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover rounded-lg mb-4 glowing-border">
                    <h3 class="text-2xl font-semibold mb-2 text-white">${product.name}</h3>
                    <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4 mt-4 w-full">
                        <button class="glowing-button px-4 py-2 rounded-md font-semibold flex-1 add-to-cart" data-name="${product.name}">Tambah ke Keranjang</button>
                        <button class="glowing-button px-4 py-2 rounded-md font-semibold flex-1 buy-now" data-name="${product.name}">Beli Sekarang</button>
                    </div>
                `;
                
                // Menambahkan event listener ke tombol
                card.querySelector('.add-to-cart').addEventListener('click', () => {
                    addToCart(product.name);
                });
                card.querySelector('.buy-now').addEventListener('click', () => {
                    openOrderModal(product.name);
                });
                
                productsContainer.appendChild(card);
            };

            // Menampilkan semua produk saat halaman dimuat
            products.forEach(createProductCard);

            // Fungsi untuk membuka modal pemesanan
            const openOrderModal = (productName) => {
                productNameInput.value = productName;
                orderModal.classList.remove('hidden');
                document.getElementById('orderDate').value = '';
                document.getElementById('orderQuantity').value = 1;
            };

            // Fungsi untuk menutup modal
            window.closeModal = (modalId) => {
                document.getElementById(modalId).classList.add('hidden');
            };

            // Event listener untuk form pemesanan
            orderForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const productName = productNameInput.value;
                const orderDate = document.getElementById('orderDate').value;
                const orderQuantity = document.getElementById('orderQuantity').value;

                // Tampilkan loader, sembunyikan teks
                buyNowText.classList.add('hidden');
                buyNowLoader.classList.remove('hidden');

                const date = new Date(orderDate);
                const day = new Intl.DateTimeFormat('id-ID', { weekday: 'long' }).format(date);
                const formattedDate = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
                
                const message = `Hallo permisi, mau order ${productName} untuk ${day}, ${formattedDate} sebanyak ${orderQuantity} porsi`;
                
                await new Promise(resolve => setTimeout(resolve, 1000)); // Simulasi delay
                
                window.open(`https://wa.me/6285816148963?text=${encodeURIComponent(message)}`, '_blank');

                closeModal('orderModal');
                
                // Sembunyikan loader, tampilkan teks
                buyNowText.classList.remove('hidden');
                buyNowLoader.classList.add('hidden');
            });

            // Fungsi pencarian produk
            searchInput.addEventListener('keyup', (e) => {
                const searchValue = e.target.value.toLowerCase();
                const productCards = document.querySelectorAll('.product-card');

                productCards.forEach(card => {
                    const productName = card.querySelector('h3').textContent.toLowerCase();
                    if (productName.includes(searchValue)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });

            // Fungsi tambah ke keranjang
            const addToCart = (productName) => {
                const existingItem = cart.find(item => item.name === productName);
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({ name: productName, quantity: 1 });
                }
                updateCartCount();
                showCartMessage('Produk ditambahkan ke keranjang!');
            };

            // Fungsi untuk menampilkan pesan kecil di atas layar
            const showCartMessage = (message) => {
                const existingMsg = document.querySelector('.cart-message');
                if (existingMsg) existingMsg.remove();
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'cart-message fixed top-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform duration-500 ease-in-out glowing-border';
                msgDiv.textContent = message;
                document.body.appendChild(msgDiv);
                
                setTimeout(() => {
                    msgDiv.style.transform = 'translateX(0)';
                }, 100);

                setTimeout(() => {
                    msgDiv.style.transform = 'translateX(150%)';
                    setTimeout(() => msgDiv.remove(), 500);
                }, 2000);
            };

            // Fungsi untuk mengupdate jumlah item di keranjang
            const updateCartCount = () => {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                cartCount.textContent = totalItems;
                cartCount.style.display = totalItems > 0 ? 'inline' : 'none';
            };

            // Event listener untuk ikon keranjang
            cartIcon.addEventListener('click', () => {
                renderCartItems();
                cartModal.classList.remove('hidden');
            });

            // Fungsi untuk menampilkan item di modal keranjang
            const renderCartItems = () => {
                cartItemsContainer.innerHTML = '';
                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = `<p class="text-gray-400 text-center">Keranjang Anda kosong.</p>`;
                    checkoutButton.classList.add('hidden');
                } else {
                    cart.forEach((item, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'flex items-center justify-between bg-gray-800 p-4 rounded-md glowing-border';
                        itemDiv.innerHTML = `
                            <div class="flex items-center space-x-4">
                                <span class="text-lg font-medium text-white">${item.name}</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <button class="text-gray-400 hover:text-white remove-from-cart" data-index="${index}">&minus;</button>
                                <span class="text-lg font-bold text-orange-400">${item.quantity}</span>
                                <button class="text-gray-400 hover:text-white add-more-to-cart" data-index="${index}">&plus;</button>
                                <button class="text-red-500 hover:text-red-300 delete-item" data-index="${index}"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `;
                        cartItemsContainer.appendChild(itemDiv);
                    });
                    checkoutButton.classList.remove('hidden');
                }
            };
            
            // Event listener untuk tombol di dalam modal keranjang
            cartItemsContainer.addEventListener('click', (e) => {
                const index = e.target.closest('button').dataset.index;
                if (!index) return;
                
                const action = e.target.closest('button').className;
                
                if (action.includes('add-more-to-cart')) {
                    cart[index].quantity++;
                } else if (action.includes('remove-from-cart')) {
                    if (cart[index].quantity > 1) {
                        cart[index].quantity--;
                    } else {
                        cart.splice(index, 1);
                    }
                } else if (action.includes('delete-item')) {
                     cart.splice(index, 1);
                }
                
                updateCartCount();
                renderCartItems();
            });

            // Event listener untuk tombol checkout
            checkoutButton.addEventListener('click', async () => {
                if (cart.length === 0) {
                    showCartMessage('Keranjang Anda kosong!');
                    return;
                }
                
                // Tampilkan loader
                checkoutText.classList.add('hidden');
                checkoutLoader.classList.remove('hidden');

                // Siapkan data untuk pesan WhatsApp
                const date = new Date();
                const day = new Intl.DateTimeFormat('id-ID', { weekday: 'long' }).format(date);
                const formattedDate = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);

                let message = `Hallo permisi, mau orderan dengan detail:\n`;
                cart.forEach(item => {
                    message += `* ${item.name}: ${item.quantity} porsi\n`;
                });
                message += `\nUntuk tanggal ${day}, ${formattedDate}`;

                await new Promise(resolve => setTimeout(resolve, 1000)); // Simulasi delay
                
                window.open(`https://wa.me/6285816148963?text=${encodeURIComponent(message)}`, '_blank');
                
                // Reset keranjang setelah checkout berhasil
                cart = [];
                updateCartCount();
                closeModal('cartModal');
                
                // Sembunyikan loader
                checkoutText.classList.remove('hidden');
                checkoutLoader.classList.add('hidden');
            });

        });
    </script>

</body>
</html>
